# Redis Configuration File
# This file contains the configuration for GoRedis server

# Server Configuration
port 6399
databases 16

# Security Configuration
# requirepass mypassword123

# Authentication Configuration
# ACL users file path
aclfile ./config/users.acl

# Logging
# logfile ./logs/redis.log
# loglevel notice

# Memory Configuration
# maxmemory 256mb
# maxmemory-policy allkeys-lru

# Persistence (not yet implemented)
# save 900 1
# save 300 10
# save 60 10000

# Network Configuration
# bind 127.0.0.1
# timeout 0
# tcp-keepalive 300

# TLS Configuration (not yet implemented)
# tls-port 6380
# tls-cert-file redis.crt
# tls-key-file redis.key

# Performance
# tcp-backlog 511
# unixsocket-perm 700